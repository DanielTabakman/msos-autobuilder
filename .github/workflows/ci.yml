name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Debug policy-paused handoff failure
        shell: bash
        run: |
          set +e
          python -m pytest -q tests/test_windows_self_update_supervisor.py::test_stable_bootstrap_handoff_accepts_running_policy_paused_refill
          status=$?
          find /tmp/pytest-of-runner -type f -name 'stable-bootstrap-update-*.json' -print -exec cat {} \; || true
          exit $status

  windows-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Debug policy-paused handoff failure
        shell: pwsh
        run: |
          python -m pytest -q tests/test_windows_self_update_supervisor.py::test_stable_bootstrap_handoff_accepts_running_policy_paused_refill
          $status = $LASTEXITCODE
          Get-ChildItem -Path $env:RUNNER_TEMP -Recurse -Filter 'stable-bootstrap-update-*.json' -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_.FullName; Get-Content -Raw $_.FullName }
          exit $status
