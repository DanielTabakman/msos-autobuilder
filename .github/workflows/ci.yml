name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize-pr118:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-50-policy-paused-refill
          fetch-depth: 0
      - name: Apply nested stub formatting correction
        shell: bash
        run: |
          python .github/pr118_format_patch.py
          rm -f .github/pr118_format_patch.py
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.11"
                    cache: pip
                - name: Install
                  run: python -m pip install -e ".[dev]"
                - name: Ruff
                  run: python -m ruff check . --output-format=json > ruff-report.json
                - name: Preserve Ruff diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: ruff-report
                    path: ruff-report.json
                    if-no-files-found: error
                    retention-days: 7
                - name: Pytest
                  run: python -m pytest -q --junitxml=pytest-report.xml
                - name: Preserve Pytest diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: pytest-report
                    path: pytest-report.xml
                    if-no-files-found: error
                    retention-days: 7

            windows-test:
              runs-on: windows-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.14"
                    cache: pip
                - name: Install
                  run: python -m pip install -e ".[dev]"
                - name: Pytest
                  run: python -m pytest -q --junitxml=pytest-windows-report.xml
                - name: Preserve Windows Pytest diagnostics
                  if: always()
                  uses: actions/upload-artifact@v4
                  with:
                    name: pytest-windows-report
                    path: pytest-windows-report.xml
                    if-no-files-found: error
                    retention-days: 7
          YAML
          python -m py_compile tests/test_windows_self_update_supervisor.py
          git diff --check
      - name: Commit clean branch
        shell: bash
        run: |
          git config user.name 'MSOS Autobuilder Review Fix'
          git config user.email 'autobuilder-review-fix@localhost'
          git add -A
          git commit -m 'Wrap nested PowerShell regression strings'
          git push origin HEAD:codex/issue-50-policy-paused-refill
