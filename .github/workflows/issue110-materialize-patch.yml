name: Issue 110 Patch Materialization

on:
  push:
    branches:
      - agent/issue-110-controlled-staging-temp-root
    paths:
      - .github/issue110-patch/**
      - .github/workflows/issue110-materialize-patch.yml

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/issue-110-controlled-staging-temp-root
          fetch-depth: 0
      - name: Reassemble verified patch
        shell: bash
        run: |
          cat .github/issue110-patch/part-*.patch > /tmp/issue110.patch
          echo 'b3066b6e09af13949614bf2d533417eee431568acee44d529efb08674a5aa00f  /tmp/issue110.patch' | sha256sum --check --strict
          git apply --check /tmp/issue110.patch
          git apply /tmp/issue110.patch
      - name: Commit materialized files
        shell: bash
        run: |
          git add src/msos_autobuilder/self_update_supervisor.py tests/test_self_update_supervisor_staging_temp.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Fix staged pytest temp isolation'
          git push origin HEAD:agent/issue-110-controlled-staging-temp-root
