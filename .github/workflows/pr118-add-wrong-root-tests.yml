name: PR 118 parser and exact root regressions

on:
  push:
    branches:
      - codex/issue-50-policy-paused-refill

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-50-policy-paused-refill
          fetch-depth: 0
      - name: Correct collection returns and add wrong-root tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          script = Path('scripts/update_windows_stable_supervisor_bootstrap.ps1')
          text = script.read_text(encoding='utf-8')
          old = '    return ,$Tokens.ToArray()\n}\n\nfunction Get-ProtectedPathEvidence'
          new = '    return $Tokens.ToArray()\n}\n\nfunction Get-ProtectedPathEvidence'
          if old not in text:
              raise SystemExit('missing tokenizer return anchor')
          text = text.replace(old, new, 1)
          old = '    return ,$Differences.ToArray()\n}\n\nfunction Assert-InstalledScheduledTaskBaseline'
          new = '    return $Differences.ToArray()\n}\n\nfunction Assert-InstalledScheduledTaskBaseline'
          if old not in text:
              raise SystemExit('missing snapshot comparison return anchor')
          script.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/test_windows_self_update_supervisor.py')
          text = tests.read_text(encoding='utf-8')
          anchor = '\ndef test_stable_bootstrap_handoff_rejects_refill_action_changed_during_restart(\n'
          if 'test_stable_bootstrap_handoff_rejects_wrong_refill_root_value' not in text:
              addition = '''\n@pytest.mark.parametrize(\n    ("wrong_field", "message"),\n    [("host", "HostRoot"), ("supervisor", "SupervisorRoot")],\n)\ndef test_stable_bootstrap_handoff_rejects_wrong_refill_root_value(\n    tmp_path: Path,\n    wrong_field: str,\n    message: str,\n) -> None:\n    powershell = shutil.which("powershell") or shutil.which("pwsh")\n    if powershell is None:\n        pytest.skip("PowerShell is not installed on this runner")\n\n    fixture = _build_stable_bootstrap_handoff_fixture(tmp_path)\n    _convert_installed_bootstrap_to_six_service_baseline(fixture)\n    _prepare_policy_paused_refill_runtime(fixture)\n    host_root = fixture["host_root"]\n    supervisor = fixture["supervisor"]\n    assert isinstance(host_root, Path)\n    assert isinstance(supervisor, Path)\n    runner = supervisor / "bootstrap" / "run_windows_managed_service.ps1"\n    action_host = "C:/wrong-host-root" if wrong_field == "host" else host_root.as_posix()\n    action_supervisor = (\n        "C:/wrong-supervisor-root"\n        if wrong_field == "supervisor"\n        else supervisor.as_posix()\n    )\n    suffix = f"""\n$global:RefillAction.Arguments = (\n    '-NoProfile -File "{runner.as_posix()}" ' +\n    '-ServiceName refill ' +\n    '-SupervisorRoot "{action_supervisor}" ' +\n    '-HostRoot "{action_host}"'\n)\n"""\n\n    result, _calls_path = _run_handoff_fixture(\n        fixture,\n        powershell,\n        tmp_path,\n        before_script=_running_refill_before_script(fixture) + suffix,\n    )\n\n    assert result.returncode != 0\n    report = _read_handoff_report(fixture)\n    assert message in json.dumps(report)\n    assert report["activation"]["performed"] is False\n\n\n'''
              if anchor not in text:
                  raise SystemExit('missing action-change test anchor')
              text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text, encoding='utf-8')
          PY
          rm -f .github/pr118-wrong-root-trigger.txt
          rm .github/workflows/pr118-add-wrong-root-tests.yml
          python -m py_compile tests/test_windows_self_update_supervisor.py
          git diff --check
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'MSOS Autobuilder Review Fix'
          git config user.email 'autobuilder-review-fix@localhost'
          git add -A
          git commit -m 'Correct strict argument tokenization'
          git push origin HEAD:codex/issue-50-policy-paused-refill
