name: PR 118 bounded review fixes
on:
  push:
    branches: [codex/issue-50-policy-paused-refill]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-50-policy-paused-refill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply and validate bounded fixes
        shell: bash
        run: |
          base64 -d <<'PATCH_B64' | gzip -d > /tmp/pr118_patch.py
 _B64
          python /tmp/pr118_patch.py
          rm .github/workflows/pr118-apply-review-fixes.yml
          python -m py_compile tests/test_windows_self_update_supervisor.py
          git diff --check
          python -m pytest -q tests/test_windows_self_update_supervisor.py -k 'running_refill or stable_bootstrap_handoff'
      - name: Commit and push
        shell: bash
        run: |
          git config user.name 'MSOS Autobuilder Review Fix'
          git config user.email 'autobuilder-review-fix@localhost'
          git add scripts/update_windows_stable_supervisor_bootstrap.ps1 tests/test_windows_self_update_supervisor.py .github/workflows/pr118-apply-review-fixes.yml
          git commit -m 'Address PR 118 bounded review blockers'
          git push origin HEAD:codex/issue-50-policy-paused-refill
