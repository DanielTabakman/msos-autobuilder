name: PR 118 bounded review fixes

on:
  push:
    branches:
      - codex/issue-50-policy-paused-refill

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-50-policy-paused-refill
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply bounded review fixes
        shell: bash
        run: |
          cat .github/pr118-chunks/{00..10} | base64 -d | gzip -d > /tmp/pr118_patch.py
          python /tmp/pr118_patch.py
          rm .github/workflows/pr118-apply-review-fixes.yml
          rm -rf .github/pr118-chunks
          python -m py_compile tests/test_windows_self_update_supervisor.py
          git diff --check
      - name: Commit and push final two-file diff
        shell: bash
        run: |
          git config user.name 'MSOS Autobuilder Review Fix'
          git config user.email 'autobuilder-review-fix@localhost'
          git add -A
          git commit -m 'Address PR 118 bounded review blockers'
          git push origin HEAD:codex/issue-50-policy-paused-refill
