name: PR 118 final bounded corrections

on:
  push:
    branches:
      - codex/issue-50-policy-paused-refill

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/issue-50-policy-paused-refill
          fetch-depth: 0
      - name: Apply final bounded corrections
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/pr118_finalize.py
          python /tmp/pr118_finalize.py
          rm .github/workflows/pr118-finalize-push.yml
          python -m py_compile tests/test_windows_self_update_supervisor.py
          git diff --check
      - name: Commit clean final branch
        shell: bash
        run: |
          git config user.name 'MSOS Autobuilder Review Fix'
          git config user.email 'autobuilder-review-fix@localhost'
          git add -A
          git commit -m 'Fix protected snapshot path normalization'
          git push origin HEAD:codex/issue-50-policy-paused-refill
